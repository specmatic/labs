<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Management</title>
  <style>
    :root { --bg:#f8f5fc; --panel:#fff; --text:#2d2438; --muted:#746a7f; --accent:#7651a8; --accent-soft:#f0e9f8; --ok:#237a4b; --warn:#a65d14; --err:#b42318; --border:#e5dced; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,"Segoe UI","Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--text); }
    body::before { content:""; display:block; height:5px; background:linear-gradient(90deg,#684494,#9b72c2,#cba8e8); }
    .wrap { max-width:980px; margin:40px auto; padding:0 20px 48px; }
    h1,h2 { margin-top:0; letter-spacing:-.02em; }
    h1 { margin-bottom:8px; font-size:30px; }
    h2 { font-size:18px; }
    p { color:var(--muted); line-height:1.55; }
    code { font-family:"SFMono-Regular",Menlo,Consolas,monospace; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px; box-shadow:0 10px 35px rgba(70,45,92,.07); margin-bottom:20px; }
    .hero { padding:30px; }
    .eyebrow { margin:0 0 8px; color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    .intro { margin:0 0 24px; }
    .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:6px; background:#f7f2fb; border:1px solid var(--border); border-radius:12px; }
    .tab { width:auto; margin:0; padding:12px 10px; border-radius:8px; background:transparent; color:var(--muted); white-space:nowrap; font-size:14px; }
    .tab[aria-selected="true"] { background:var(--panel); color:var(--accent); box-shadow:0 2px 8px rgba(70,45,92,.1); }
    .step { display:none; min-height:240px; padding:30px 6px 6px; }
    .step.active { display:block; }
    .step h2 { margin-bottom:16px; }
    .fields { max-width:460px; }
    label { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
    input,button { width:100%; font:inherit; padding:11px 12px; border-radius:9px; border:1px solid var(--border); }
    input { background:#fff; color:var(--text); outline:none; }
    input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    button { border:0; background:var(--accent); color:white; font-weight:700; cursor:pointer; transition:transform .12s,box-shadow .12s; }
    .fields button { margin-top:16px; }
    .tabs .tab { margin:0; background:transparent; color:var(--muted); }
    .tabs .tab[aria-selected="true"] { background:var(--panel); color:var(--accent); }
    button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 5px 14px rgba(118,81,168,.24); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .message { display:none; position:fixed; top:16px; left:16px; z-index:10; width:min(340px,calc(100vw - 32px)); border-radius:12px; padding:13px 42px 13px 16px; border:1px solid var(--border); border-left:4px solid var(--accent); background:#fff; color:var(--text); box-shadow:0 12px 30px rgba(70,45,92,.14); }
    .message.show { display:block; animation:toast-in .18s ease-out; }
    .message.ok { border-left-color:var(--ok); }
    .message.warn { border-left-color:var(--warn); }
    .message.err { border-left-color:var(--err); }
    .message strong { display:block; margin-bottom:4px; }
    .message-close { position:absolute; top:8px; right:8px; width:30px; padding:5px; margin:0; background:transparent; color:currentColor; font-size:18px; line-height:1; }
    button.message-close:hover:not(:disabled) { transform:none; box-shadow:none; background:rgba(0,0,0,.05); }
    @keyframes toast-in { from { opacity:0; transform:translateY(-8px); } }
    pre { margin:8px 0 0; padding:15px; border-radius:10px; background:#2d2635; color:#f5effa; overflow:auto; white-space:pre-wrap; line-height:1.5; }
    details { border:1px solid var(--border); border-radius:10px; margin-top:10px; background:#fcf9fe; overflow:hidden; }
    summary { cursor:pointer; padding:13px 15px; font-family:"SFMono-Regular",Menlo,monospace; font-weight:700; font-size:13px; }
    .traffic-row { display:grid; grid-template-columns:70px 1fr auto; align-items:center; gap:12px; }
    .traffic-header { display:grid; grid-template-columns:70px 1fr auto; gap:12px; padding:0 15px 6px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .traffic-header span:last-child { min-width:72px; text-align:center; }
    .traffic-method { color:var(--accent); }
    .traffic-path { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .traffic-status { min-width:72px; padding:3px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); text-align:center; }
    .traffic-status.ok { background:#ecfdf3; color:var(--ok); }
    .traffic-status.error { background:#fef3f2; color:var(--err); }
    details pre { margin:0; border-radius:0; }
    .traffic-empty { color:var(--muted); }
    @media (max-width:700px) { .tabs { grid-template-columns:1fr 1fr; } }
    @media (max-width:480px) { .wrap { margin-top:24px; padding:0 12px 32px; } .panel,.hero { padding:20px; } .tabs { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel hero">
      <p class="eyebrow">Product catalog</p>
      <h1>Product management</h1>
      <p class="intro">Create, find, update, and delete products.</p>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div class="tabs" role="tablist" aria-label="Product operations">
        <button class="tab" role="tab" aria-selected="true" aria-controls="create-panel" id="create-tab" tabindex="0">1. Create Product</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="fetch-panel" id="fetch-tab" tabindex="-1">2. Fetch Product</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="update-panel" id="update-tab" tabindex="-1">3. Update Product</button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="delete-panel" id="delete-tab" tabindex="-1">4. Delete Product</button>
      </div>
      <div id="create-panel" class="step active" role="tabpanel" aria-labelledby="create-tab">
        <h2>Create Product</h2>
        <div class="fields">
          <label for="name">Name</label><input id="name" value="Wireless Keyboard" required />
          <label for="price">Price</label><input id="price" type="number" step="0.01" value="2499" required />
          <button id="create">Create Product</button>
        </div>
      </div>
      <div id="fetch-panel" class="step" role="tabpanel" aria-labelledby="fetch-tab" hidden>
        <h2>Fetch Product</h2>
        <div class="fields">
          <label for="fetchId">Product ID</label><input id="fetchId" placeholder="Created product ID" />
          <button id="fetch" disabled>Fetch Product</button>
        </div>
      </div>
      <div id="update-panel" class="step" role="tabpanel" aria-labelledby="update-tab" hidden>
        <h2>Update Product</h2>
        <div class="fields">
          <label for="updateId">Product ID</label><input id="updateId" placeholder="Created product ID" />
          <label for="newPrice">New price</label><input id="newPrice" type="number" step="0.01" value="2199" required />
          <button id="update" disabled>Update Product</button>
        </div>
      </div>
      <div id="delete-panel" class="step" role="tabpanel" aria-labelledby="delete-tab" hidden>
        <h2>Delete Product</h2>
        <div class="fields">
          <label for="deleteId">Product ID</label><input id="deleteId" placeholder="Created product ID" />
          <button id="delete" disabled>Delete Product</button>
        </div>
      </div>
    </section>
    <section class="panel">
      <p class="eyebrow">Request history</p>
      <h2>API Traffic</h2>
      <div class="traffic-header" aria-hidden="true"><span>Method</span><span>Endpoint</span><span>Status</span></div>
      <div id="traffic" class="traffic-empty">No requests yet.</div>
    </section>
  </main>
  <script>
    const baseUrl = "http://127.0.0.1:9100";
    const message = document.getElementById("message");
    const traffic = document.getElementById("traffic");
    let createdProduct = null;
    let deletedProductId = null;
    let messageTimer;

    const idValue = operation => document.getElementById(`${operation}Id`).value.trim();

    function syncControls(busy = false) {
      document.getElementById("create").disabled = busy;
      document.getElementById("fetch").disabled = busy || !idValue("fetch");
      document.getElementById("update").disabled = busy || !idValue("update") || idValue("update") === deletedProductId;
      document.getElementById("delete").disabled = busy || !idValue("delete") || idValue("delete") === deletedProductId;
    }

    function activateTab(tabId) {
      const tab = document.getElementById(tabId);
      document.querySelectorAll(".tab").forEach(item => {
        const selected = item === tab;
        item.setAttribute("aria-selected", String(selected));
        item.tabIndex = selected ? 0 : -1;
      });
      document.querySelectorAll(".step").forEach(panel => {
        const active = panel.id === tab.getAttribute("aria-controls");
        panel.classList.toggle("active", active);
        panel.hidden = !active;
      });
      tab.focus();
    }
    document.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => activateTab(tab.id)));
    ["fetchId", "updateId", "deleteId"].forEach(id => document.getElementById(id).addEventListener("input", () => syncControls()));
    document.querySelector(".tabs").addEventListener("keydown", event => {
      const tabs = [...document.querySelectorAll(".tab")];
      const current = tabs.indexOf(document.activeElement);
      if (current < 0) return;
      const next = event.key === "ArrowRight" ? (current + 1) % tabs.length
        : event.key === "ArrowLeft" ? (current - 1 + tabs.length) % tabs.length
        : event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : null;
      if (next == null) return;
      event.preventDefault();
      activateTab(tabs[next].id);
    });

    const pretty = value => value == null ? "No body" : JSON.stringify(value, null, 2);
    const sameProduct = (a, b) => a && b && a.productId === b.productId && a.name === b.name && Number(a.price) === Number(b.price);

    function hideMessage() {
      message.className = "message";
    }

    function showMessage(kind, title, text = "") {
      clearTimeout(messageTimer);
      message.className = `message show ${kind}`;
      const heading = document.createElement("strong");
      heading.textContent = title;
      const close = document.createElement("button");
      close.className = "message-close";
      close.type = "button";
      close.setAttribute("aria-label", "Dismiss notification");
      close.textContent = "×";
      close.addEventListener("click", hideMessage);
      message.replaceChildren(heading);
      if (text) {
        const detail = document.createElement("span");
        detail.textContent = text;
        message.appendChild(detail);
      }
      message.appendChild(close);
      messageTimer = setTimeout(hideMessage, 1800);
    }

    function addTraffic(method, path, requestBody, status, responseBody) {
      if (traffic.classList.contains("traffic-empty")) { traffic.className = ""; traffic.textContent = ""; }
      const entry = document.createElement("details");
      const summary = document.createElement("summary");
      summary.className = "traffic-row";
      const methodEl = document.createElement("span");
      methodEl.className = "traffic-method";
      methodEl.textContent = method;
      const pathEl = document.createElement("span");
      pathEl.className = "traffic-path";
      pathEl.textContent = path;
      const statusEl = document.createElement("span");
      const statusNumber = Number(status);
      statusEl.className = `traffic-status ${statusNumber >= 200 && statusNumber < 300 ? "ok" : statusNumber >= 400 ? "error" : ""}`;
      statusEl.textContent = Number.isFinite(statusNumber) ? `HTTP ${statusNumber}` : String(status);
      summary.append(methodEl, pathEl, statusEl);
      entry.appendChild(summary);
      const pre = document.createElement("pre");
      pre.textContent = `${requestBody == null ? "" : `Request\n${pretty(requestBody)}\n\n`}Response ${status}\n${pretty(responseBody)}`;
      entry.appendChild(pre);
      traffic.prepend(entry);
    }

    async function call(method, path, body) {
      clearTimeout(messageTimer);
      hideMessage();
      syncControls(true);
      try {
        const response = await fetch(baseUrl + path, {
          method,
          headers: body == null ? {} : { "Content-Type": "application/json" },
          body: body == null ? undefined : JSON.stringify(body)
        });
        const text = await response.text();
        let data = null;
        if (text) { try { data = JSON.parse(text); } catch { data = text; } }
        addTraffic(method, path, body, response.status, data);
        return { response, data };
      } catch (error) {
        addTraffic(method, path, body, "NETWORK ERROR", String(error));
        showMessage("err", "Service unavailable", "Product service could not be reached. Try again shortly.");
        return null;
      } finally {
        syncControls();
      }
    }

    document.getElementById("create").addEventListener("click", async () => {
      const nameInput = document.getElementById("name");
      const priceInput = document.getElementById("price");
      const name = nameInput.value.trim();
      const price = Number(priceInput.value);
      if (!name) { showMessage("err", "Name required", "Enter a product name."); return nameInput.focus(); }
      if (!priceInput.value.trim() || !Number.isFinite(price)) { showMessage("err", "Valid price required", "Enter a numeric product price."); return priceInput.focus(); }
      const body = { name, price };
      const outcome = await call("POST", "/products", body);
      if (!outcome?.response.ok || !outcome.data?.productId) return showMessage("err", "Create failed", "Product service returned an invalid response.");
      createdProduct = outcome.data;
      deletedProductId = null;
      ["fetchId", "updateId", "deleteId"].forEach(id => document.getElementById(id).value = String(outcome.data.productId));
      syncControls();
      showMessage("ok", "Product created");
    });

    document.getElementById("fetch").addEventListener("click", async () => {
      const requestedId = idValue("fetch");
      const createdId = createdProduct && String(createdProduct.productId);
      const outcome = await call("GET", `/products/${encodeURIComponent(requestedId)}`);
      if (!outcome) return;
      if (outcome.response.status === 404) return requestedId === createdId && requestedId !== deletedProductId
        ? showMessage("warn", "Created product could not be found")
        : showMessage("ok", "Product not found");
      if (!outcome.response.ok) return showMessage("err", "Fetch failed", `HTTP ${outcome.response.status}`);
      if (requestedId === createdId && !sameProduct(createdProduct, outcome.data)) return showMessage("warn", "Product data did not match", "Fetched data differs from the Product you created.");
      showMessage("ok", "Product found");
      if (requestedId === createdId) createdProduct = outcome.data;
    });

    document.getElementById("update").addEventListener("click", async () => {
      const priceInput = document.getElementById("newPrice");
      const price = Number(priceInput.value);
      if (!priceInput.value.trim() || !Number.isFinite(price)) { showMessage("err", "Valid price required", "Enter a numeric product price."); return priceInput.focus(); }
      const requestedId = idValue("update");
      const outcome = await call("PATCH", `/products/${encodeURIComponent(requestedId)}`, { price });
      if (!outcome) return;
      if (!outcome.response.ok) return showMessage("err", "Update failed", `HTTP ${outcome.response.status}`);
      if (createdProduct && requestedId === String(createdProduct.productId)) createdProduct = outcome.data;
      showMessage("ok", "Product updated");
    });

    document.getElementById("delete").addEventListener("click", async () => {
      const requestedId = idValue("delete");
      const outcome = await call("DELETE", `/products/${encodeURIComponent(requestedId)}`);
      if (!outcome) return;
      outcome.response.status === 204
        ? showMessage("ok", "Product deleted")
        : showMessage("err", "Delete failed", `HTTP ${outcome.response.status}`);
      if (outcome.response.status === 204) {
        deletedProductId = requestedId;
        syncControls();
      }
    });
  </script>
</body>
</html>
