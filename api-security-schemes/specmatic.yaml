version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/orderService"
    runOptions:
      $ref: "#/components/runOptions/orderServiceTest"
    data:
      examples:
        - directories:
            - ./auth_examples
    settings:
      schemaResiliencyTests: all
specmatic:
  governance:
    successCriteria:
      minCoveragePercentage: 70
      maxMissedOperationsInSpec: 4
      enforce: true
  license:
    path: /specmatic/specmatic-license.txt
components:
  sources:
    labsContracts:
      git:
        url: https://github.com/specmatic/labs-contracts.git
  services:
    orderService:
      description: Order Service with Multiple Auth Schemes
      definitions:
        - definition:
            source:
              $ref: "#/components/sources/labsContracts"
            specs:
              - spec:
                  id: orderApiSpec
                  path: openapi/security/order-api-with-auth_v2.yaml
  runOptions:
    orderServiceTest:
      openapi:
        type: test
        filter: "PATH!='/internal/metrics' && PATH!='/health'"
        baseUrl: ${APP_BASE_URL:https://localhost:8443}
        actuatorUrl: ${APP_BASE_URL:https://localhost:8443}/actuator/mappings
        cert:
          keyStore:
            file: ${SPECMATIC_CLIENT_KEYSTORE:./certs/specmatic-client.jks}
            alias: specmatic-client
            password: ${SPECMATIC_CLIENT_KEY_PASSWORD:changeit}
          keyStorePassword: ${SPECMATIC_CLIENT_KEYSTORE_PASSWORD:changeit}
        specs:
          - spec:
              id: orderApiSpec
              securitySchemes:
                basic-auth:
                  type: basicAuth
                  token: ${BASIC_AUTH_TOKEN:ZGVmYXVsdC11c2VyOmRlZmF1bHQtdXNlcgo=}
                api-key-auth:
                  type: apiKey
                  token: ${API_KEY:INVALID_APIKEY1234}
